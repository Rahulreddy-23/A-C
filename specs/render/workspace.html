<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DHF Automation</title>
<style>
:root{color-scheme:light;
--primary:#315cbb;--primary-ink:#ffffff;--primary-hover:#284d9e;--ink:#22262e;--muted:#535c6c;--paper:#fafbfc;--surface:#ffffff;
--chrome:#f0f2f5;--line:#d8dde5;--line-soft:#e8ebf0;--nav-active:#e1e7f0;--selection:#edf2ff;
--warn:#935015;--warn-wash:#fbf1e4;--gap:#a54420;--gap-wash:#fbebe5;--stale:#704a93;--stale-wash:#f3edf9;--ok:#28634e;--ok-wash:#e8f3ee;
--fill-warn:#b8732a;--fill-ok:#28634e;--drawer:0 8px 24px rgb(20 35 55 / .18)}
:root[data-theme=dark]{color-scheme:dark;
--primary:#8aa9ee;--primary-ink:#0f1726;--primary-hover:#a3bcf3;--ink:#e6e8ec;--muted:#a6aebb;--paper:#15181d;--surface:#1b1f26;
--chrome:#20252d;--line:#363c48;--line-soft:#2b3039;--nav-active:#2c3442;--selection:#25314a;
--warn:#e7ab6b;--warn-wash:#33271a;--gap:#f19478;--gap-wash:#3a2420;--stale:#c8a8ec;--stale-wash:#2f2440;--ok:#7cc7a1;--ok-wash:#1d3229;
--fill-warn:#d79a55;--fill-ok:#5fae86;--drawer:0 8px 24px rgb(0 0 0 / .5)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;caret-color:var(--primary);accent-color:var(--primary);scrollbar-color:var(--line) transparent}
::selection{background:var(--selection);color:var(--ink)}
a{color:var(--primary);text-underline-offset:2px}
h1,h2,h3,p,dl,dd,ul,ol{margin:0}
ul,ol{padding:0;list-style:none}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
main:focus,main:focus-visible{outline:none}
.mono,.id,code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px}
.id{font-weight:600}
.num{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.s-ok{color:var(--ok)}.s-warn{color:var(--warn)}.s-gap{color:var(--gap)}.s-stale{color:var(--stale)}
.app{display:grid;grid-template:52px minmax(0,1fr) 30px/184px minmax(0,1fr);height:100%}
.top{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:0 16px;background:var(--surface);border-bottom:1px solid var(--line);min-width:0}
.brand{display:flex;align-items:center;gap:8px;font-weight:650;font-size:14px;color:var(--ink);text-decoration:none;white-space:nowrap}
.brand-mark{display:grid;place-items:center;width:22px;height:22px;border-radius:5px;background:var(--primary);color:var(--primary-ink);font-size:12px;font-weight:700}
.switch{min-width:0;max-width:340px}
.switch select{width:100%}
.class{color:var(--muted);font-size:12px;white-space:nowrap}
.class.confidential{color:var(--warn)}
.top .spacer{flex:1}
.who{color:var(--muted);font-size:12px;white-space:nowrap}
.top .menu{display:none}
.rail{background:var(--chrome);border-right:1px solid var(--line);overflow:auto;padding:10px 8px 20px}
.rail a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 10px;border-radius:5px;color:var(--ink);text-decoration:none;min-height:30px}
.rail a:hover{background:var(--line-soft)}
.rail a[aria-current=page]{background:var(--nav-active);font-weight:600}
.rail a small{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:11px;color:var(--muted);font-weight:400}
.rail h2{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:16px 10px 4px}
main{overflow:auto;padding:20px 28px 48px;min-width:0}
.status{grid-column:1/-1;display:flex;align-items:center;gap:22px;padding:0 16px;background:var(--chrome);border-top:1px solid var(--line);color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden}
.status span{overflow:hidden;text-overflow:ellipsis}
.page{max-width:1320px;margin:0 auto}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px;margin-bottom:18px}
h1{font-size:22px;font-weight:650;letter-spacing:-.025em;line-height:1.25}
.head p{color:var(--muted);margin-top:4px;max-width:90ch}
.cols{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(0,1fr);gap:0 32px;align-items:start}
.section{border-top:1px solid var(--line);padding:12px 0 18px;min-width:0}
.section-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 12px;margin-bottom:8px}
.section-head h2{font-size:13px;font-weight:650}
.section-head span{color:var(--muted)}
.lead{color:var(--muted);margin:-4px 0 10px;max-width:90ch}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:32px;padding:5px 12px;border:1px solid var(--line);border-radius:5px;background:var(--surface);color:var(--ink);font:inherit;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--chrome);color:var(--ink)}
.btn:active{background:var(--line-soft)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn.primary:hover{background:var(--primary-hover);border-color:var(--primary-hover)}
.btn.quiet{border-color:transparent;background:transparent;color:var(--primary);padding-inline:8px}
.btn.quiet:hover{background:var(--selection)}
.btn.danger{color:var(--gap)}
.btn:disabled{opacity:.5;cursor:default}
.btn[aria-busy=true]{cursor:progress}
.btn[aria-busy=true]::after{content:"";width:12px;height:12px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(1turn)}}
.actions{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
input:not([type=checkbox]):not([type=file]),select,textarea{width:100%;min-height:32px;padding:5px 8px;border:1px solid var(--line);border-radius:5px;background:var(--surface);color:var(--ink);font:inherit}
input:not([type=checkbox]):not([type=file]):hover,select:hover,textarea:hover{border-color:var(--muted)}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--primary);outline-offset:0;border-color:var(--primary)}
input:disabled{opacity:.6}
textarea{min-height:72px;resize:vertical}
input[type=checkbox]{width:16px;height:16px;margin:0}
label{font-weight:600}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field small,.help{color:var(--muted);font-size:12px;font-weight:400}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}
.fields .wide{grid-column:1/-1}
.form{display:grid;gap:12px;max-width:760px}
.pat{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.check{display:inline-flex;align-items:center;gap:6px;font-weight:400}
.note{padding:8px 12px;border-radius:5px;border:1px solid var(--line);background:var(--chrome);overflow-wrap:anywhere}
.note.ok{background:var(--ok-wash);border-color:transparent;color:var(--ok)}
.note.warn{background:var(--warn-wash);border-color:transparent;color:var(--warn)}
.note.error{background:var(--gap-wash);border-color:transparent;color:var(--gap)}
.note:empty{display:none}
.table-wrap{overflow:auto;max-width:100%;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
table{width:100%;border-collapse:collapse;text-align:left}
th,td{padding:7px 10px;border-bottom:1px solid var(--line-soft);vertical-align:top;overflow-wrap:anywhere}
th{position:sticky;top:0;z-index:1;background:var(--chrome);font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap;border-bottom-color:var(--line)}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--paper)}
td.r,th.r{text-align:right}
td.missing{color:var(--gap)}
.ids{display:flex;flex-wrap:wrap;gap:2px 8px}
.bar{display:grid;grid-template-columns:minmax(110px,150px) minmax(0,1fr) minmax(108px,auto);align-items:center;gap:12px;padding:5px 0}
.bar .track{height:6px;border-radius:3px;background:var(--chrome);overflow:hidden}
.bar .track i{display:block;height:100%;border-radius:3px;background:var(--fill-warn)}
.bar .track i.full{background:var(--fill-ok)}
.bar .fig{text-align:right;color:var(--muted)}
.figures{display:flex;flex-wrap:wrap;gap:8px 32px}
.figures div{display:flex;flex-direction:column;color:var(--muted);font-size:12px}
.figures b{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-variant-numeric:tabular-nums;font-size:20px;font-weight:650;color:var(--ink);line-height:1.3}
.figures b.s-gap{color:var(--gap)}.figures b.s-warn{color:var(--warn)}
.kv{display:grid;grid-template-columns:minmax(120px,max-content) minmax(0,1fr);gap:6px 16px}
.kv dt{color:var(--muted)}.kv dd{overflow-wrap:anywhere}
.rows>li{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line-soft)}
.rows>li:last-child{border-bottom:0}
.tabs{display:flex;flex-wrap:wrap;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px}
.tabs a{padding:8px 12px;color:var(--muted);text-decoration:none;border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:600}
.tabs a:hover{color:var(--ink)}
.tabs a[aria-current=page]{color:var(--ink);border-bottom-color:var(--primary)}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-bottom:10px}
.toolbar input[type=search]{max-width:280px}
.toolbar select{width:auto;min-width:150px}
.steps{display:flex;flex-wrap:wrap;gap:4px 18px;margin-top:6px;color:var(--muted)}
.steps li{display:flex;align-items:center;gap:6px}
.steps li.done{color:var(--ok)}
.steps li.now{color:var(--ink);font-weight:600}
.steps svg{flex:none}
.upload{padding:10px 0;border-bottom:1px solid var(--line-soft)}
.upload:last-child{border-bottom:0}
.upload-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
.file-pick{position:relative;overflow:hidden}
.file-pick input{position:absolute;inset:0;opacity:0;cursor:pointer}
.file-pick:focus-within{outline:2px solid var(--primary);outline-offset:2px}
.file{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;padding:2px 0;overflow-wrap:anywhere}
.suggestion td{padding-top:10px;padding-bottom:10px}
.suggestion p{max-width:100ch}
.sources{display:flex;flex-wrap:wrap;gap:2px 10px;margin-top:4px;font-size:12px;color:var(--muted)}
.bulk{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;align-items:end;padding:12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);margin-bottom:12px}
.empty{padding:28px 0;color:var(--muted);max-width:70ch}
.empty h2{font-size:15px;font-weight:650;color:var(--ink);margin-bottom:4px}
.empty .actions{margin-top:12px}
.skeleton{display:grid;gap:10px;padding-top:6px}
.skeleton i{display:block;height:12px;border-radius:3px;background:var(--chrome)}
.skeleton i:nth-child(2n){width:72%}.skeleton i:nth-child(3n){width:48%}
.startup{display:grid;place-items:center;height:100%;padding:24px;color:var(--muted)}
details>summary{cursor:pointer;color:var(--primary);font-weight:600}
details[open]>summary{margin-bottom:8px}
@media (max-width:1100px){.cols{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){
.app{grid-template-columns:minmax(0,1fr)}
.top .menu{display:inline-flex}
.rail{position:fixed;top:52px;bottom:30px;left:0;width:248px;z-index:10;box-shadow:var(--drawer);transform:translateX(-105%);transition:transform .18s cubic-bezier(.23,1,.32,1)}
.rail.open{transform:none}
main{padding:16px}
.class,.who,.brand-name{display:none}
.top{gap:8px;padding:0 8px}
.switch{flex:1;max-width:none}
.top .spacer{display:none}
.fields,.bulk{grid-template-columns:minmax(0,1fr)}
.bar{grid-template-columns:minmax(0,1fr) auto}.bar .track{grid-column:1/-1;grid-row:2}
.status span:nth-child(n+3){display:none}
}
@media (prefers-reduced-motion:reduce){.rail{transition:none}.btn[aria-busy=true]::after{animation:none}}
</style>
</head>
<body>
<div class="startup" id="startup"><p id="startup-text" role="status">Opening the workspace…</p></div>
<div class="app" id="app" hidden>
<header class="top">
<button class="btn quiet menu" id="menu" type="button" aria-controls="rail" aria-expanded="false" aria-label="Open navigation"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4h12M2 8h12M2 12h12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
<a class="brand" href="#/overview" aria-label="DHF Automation overview"><span class="brand-mark" aria-hidden="true">D</span><span class="brand-name">DHF Automation</span></a>
<div class="switch"><select id="project-select" aria-label="Current project"></select></div>
<span class="class" id="data-class"></span>
<span class="spacer"></span>
<button class="btn quiet" id="theme" type="button">Dark appearance</button>
<span class="who" id="who"></span>
</header>
<nav class="rail" id="rail" aria-label="Workspace"></nav>
<main id="main" tabindex="-1"></main>
<footer class="status" id="status" aria-label="Evidence provenance"></footer>
</div>
<script>
'use strict';
(() => {
const $ = id => document.getElementById(id);
const DOCS = ['sad', 'sdd', 'sstr', 'drr', 'sfmea'];
const SHORT = {sad: 'SAD', sdd: 'SDD', sstr: 'SSTR', drr: 'DRR', sfmea: 'sFMEA'};
const STAGE = {
  no_inputs: ['No inputs', 'muted'], inputs_ready: ['Inputs ready', ''], draft: ['Needs review', 's-warn'],
  in_review: ['In review', 's-warn'], ready: ['Ready for approval', 's-ok'], approved: ['Approved', 's-ok']
};
const REASON = {
  section_integrity: 'Section boundaries were edited', ai_unavailable: 'Sections AI could not draft',
  stale: 'Stale sections', human_input_required: 'Sections that need a person',
  unresolved_suggestion: 'AI suggestions to decide', rejected_text_present: 'Rejected text still present',
  suggestion_label_present: 'Suggestion labels still present', unreviewed_validator_rejection: 'Validator rejections to note'
};
const CAUSE = {
  query_facts_changed: 'computed facts changed', entity_removed: 'the item it describes was removed',
  one_hop_neighbor: 'a linked item changed', revision_changed: 'source revision changed', content_changed: 'source content changed'
};
const SELECTORS = {
  saved_query: ['Saved query ID', 'GUID of a saved query'], wiql: ['WIQL', 'SELECT [System.Id] FROM WorkItems WHERE …'],
  area_path: ['Area path', 'Project\\Area'], work_item_ids: ['Work item IDs', '1201, 1202, 1215']
};
const TYPES = {
  user_need: 'User need', system_req: 'System requirement', software_req: 'Software requirement', component: 'Software item',
  software_unit: 'Software unit', code_change: 'Code change', test_case: 'Test case', test_result: 'Test result', test_run: 'Test run',
  risk_control: 'Risk control', hazard: 'Hazard', defect: 'Defect', review: 'Review', action_item: 'Action item',
  adr: 'Architecture decision', soup: 'SOUP', document_section: 'Document section'
};
const ctx = {session: null, projects: [], pid: null, project: null};
let view = 0, busy = false, flash = null;

function h(tag, props, ...children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(props || {})) {
    if (value === undefined || value === null || value === false) continue;
    if (key === 'class') node.className = value;
    else if (key === 'text') node.textContent = value;
    else if (key.startsWith('on')) node.addEventListener(key.slice(2), value);
    else if (key in node && typeof value !== 'string') node[key] = value;
    else node.setAttribute(key, value === true ? '' : value);
  }
  for (const child of children.flat(Infinity)) {
    if (child === undefined || child === null || child === false) continue;
    node.append(child instanceof Node ? child : document.createTextNode(String(child)));
  }
  return node;
}
function icon(d, size = 14) {
  const ns = 'http://www.w3.org/2000/svg', svg = document.createElementNS(ns, 'svg'), path = document.createElementNS(ns, 'path');
  for (const [k, v] of [['width', size], ['height', size], ['viewBox', '0 0 16 16'], ['aria-hidden', 'true']]) svg.setAttribute(k, v);
  for (const [k, v] of [['d', d], ['fill', 'none'], ['stroke', 'currentColor'], ['stroke-width', '1.6'], ['stroke-linecap', 'round'], ['stroke-linejoin', 'round']]) path.setAttribute(k, v);
  svg.append(path);
  return svg;
}
const CHECK = 'M3 8.5l3 3 7-7', CIRCLE = 'M8 2.5a5.5 5.5 0 1 0 0 11a5.5 5.5 0 1 0 0-11';
const web = url => /^https?:\/\//i.test(url || '') ? url : null;
const when = value => value ? new Date(value).toLocaleString([], {dateStyle: 'medium', timeStyle: 'short'}) : '—';
const pct = value => value === null || value === undefined ? '—' : (Math.round(value * 10) / 10).toLocaleString() + '%';
const plural = (n, one, many = one + 's') => n.toLocaleString() + ' ' + (n === 1 ? one : many);
const stage = s => h('span', {class: (STAGE[s] || [s, ''])[1], text: (STAGE[s] || [s])[0]});
const note = (text, tone = '') => h('p', {class: 'note ' + tone, role: tone === 'error' ? 'alert' : 'status', text});
function say(node, text, tone = '') { node.textContent = text; node.className = 'note ' + tone; node.setAttribute('role', tone === 'error' ? 'alert' : 'status'); }
const btn = (text, onclick, cls = '') => h('button', {class: 'btn ' + cls, type: 'button', text, onclick});
const link = (href, text, cls = 'btn') => h('a', {class: cls, href, text});
const external = (href, text, cls = 'btn') => h('a', {class: cls, href, text, target: '_blank', rel: 'noopener'});
const download = (href, text, cls = 'btn') => h('a', {class: cls, href, text, download: ''});
const section = (title, meta, ...body) => h('section', {class: 'section'}, h('div', {class: 'section-head'}, h('h2', {text: title}), meta ? h('span', {text: meta}) : null), ...body);
const head = (title, text, ...actions) => h('div', {class: 'head'}, h('div', {}, h('h1', {text: title}), text ? h('p', {text}) : null), actions.some(Boolean) ? h('div', {class: 'actions'}, actions) : null);
const empty = (title, text, ...actions) => h('div', {class: 'empty'}, h('h2', {text: title}), h('p', {text}), actions.length ? h('div', {class: 'actions'}, actions) : null);
function table(columns, rows, emptyText = 'Nothing to show.') {
  if (!rows.length) return h('p', {class: 'muted', text: emptyText});
  return h('div', {class: 'table-wrap'}, h('table', {}, h('thead', {}, h('tr', {}, columns.map(c => typeof c === 'string' ? h('th', {scope: 'col', text: c}) : c))), h('tbody', {}, rows)));
}
const ref = item => web(item.url)
  ? h('a', {class: 'id', href: item.url, target: '_blank', rel: 'noopener', title: [TYPES[item.type] || '', item.title || '', item.revision ? 'revision ' + item.revision : ''].filter(Boolean).join(' · '), text: item.id})
  : h('span', {class: 'id', title: item.title || '', text: item.id});
function ids(list, titles = {}, types = {}) {
  if (!list.length) return h('span', {text: '—'});
  return h('span', {class: 'ids'}, list.map(id => h('span', {class: 'id', title: [TYPES[types[id]], titles[id]].filter(Boolean).join(': '), text: id})));
}
function bars(rows) {
  return h('div', {}, rows.map(r => {
    const value = r.assessable === false ? null : r.percent;
    return h('div', {class: 'bar'}, r.href ? h('a', {href: r.href, text: r.label}) : h('span', {text: r.label}),
      h('div', {class: 'track', role: 'img', 'aria-label': r.label + ': ' + (value === null ? 'not assessable' : r.covered + ' of ' + r.total)},
        h('i', {class: r.total && r.covered === r.total ? 'full' : '', style: 'width:' + (value ?? 0) + '%'})),
      h('span', {class: 'fig num', text: value === null ? 'not assessable' : r.covered + ' / ' + r.total + ' · ' + pct(value)}));
  }));
}

async function api(path, options = {}) {
  const response = await fetch(path, {credentials: 'same-origin', ...options});
  const type = response.headers.get('Content-Type') || '';
  const result = type.includes('json') ? await response.json() : {};
  if (!response.ok) throw Object.assign(new Error(result.error || 'The request failed.'), {action: result.action, status: response.status});
  return result;
}
const send = (method, value) => ({method, headers: {'Content-Type': 'application/json'}, body: JSON.stringify(value ?? {})});
const base = () => '/api/projects/' + encodeURIComponent(ctx.pid);
const docRoute = doc => base() + '/documents/' + doc;
async function act(button, fn, onError) {
  if (busy) return;
  busy = true;
  if (button) { button.disabled = true; button.setAttribute('aria-busy', 'true'); }
  try { await fn(); }
  catch (error) { if (onError) onError(error); else window.alert(error.message); }
  finally { busy = false; if (button?.isConnected) { button.disabled = false; button.removeAttribute('aria-busy'); } }
}

/* shell */
function routeParts() {
  const [name = 'overview', sub = '', extra = ''] = location.hash.replace(/^#\/?/, '').split('/');
  return [name === 'dashboard' ? 'overview' : name || 'overview', sub, extra];
}
function paintRail() {
  const docs = Object.fromEntries((ctx.project?.documents || []).map(d => [d.type, d]));
  const mark = d => !d ? '' : d.draft ? 'v' + d.draft.version : d.future ? 'inputs' : d.stage === 'inputs_ready' ? 'ready' : '—';
  const open = ctx.project ? ctx.project.documents.reduce((n, d) => n + (d.draft ? d.draft.readiness.blockers.length : 0), 0) : 0;
  $('rail').replaceChildren(
    h('a', {href: '#/overview', 'data-route': 'overview'}, 'Overview'),

function changesView(data) {
  return [h('p', {class: 'lead', text: 'Update draft redrafts only the stale sections, and Redraft from scratch redrafts all of them. Either way the Word file marks insertions and deletions against the previous reviewed text.'}),
    table(['Document', 'Version', 'Tracked changes', ''], data.queue.map(q => h('tr', {},
      h('td', {text: q.document_title + ' (' + SHORT[q.document] + ')'}), h('td', {class: 'num', text: 'v' + q.version}),
      h('td', {class: 'num'}, q.redline ? q.tracked_changes.insertions + ' insertions · ' + q.tracked_changes.deletions + ' deletions' : h('span', {class: 'muted', text: 'none: first draft, or the approved text'})),
      h('td', {}, download(docRoute(q.document) + '/files/' + q.document + '.docx', 'Word', 'btn quiet')))))];
}
function approvalView(data) {
  return data.queue.map(q => {
    const status = h('p', {class: 'note'});
    const refId = 'ref-' + q.document, noteId = 'comment-' + q.document;
    const reference = h('input', {id: refId, maxlength: '120', placeholder: 'For example DCR-1234'});
    const comment = h('textarea', {id: noteId, rows: 2, maxlength: '2000'});
    const record = btn('Record approval', () => {
      if (!reference.value.trim()) { say(status, 'Enter the eQMS reference.', 'error'); reference.focus(); return; }
      act(record, async () => {
        await api(docRoute(q.document) + '/approval', send('POST', {reference: reference.value, comment: comment.value}));
        flash = {text: 'Approval recorded. v' + q.version + ' is now the baseline.', tone: 'ok'};
        render(false);
      }, error => say(status, error.message, 'error'));
    }, 'primary');
    const count = Object.values(q.blockers).reduce((n, v) => n + v, 0);
    return section(q.document_title + ' (' + SHORT[q.document] + ')', 'v' + q.version + ' · ' + (STAGE[q.stage] || [q.stage])[0],
      steps(q.stage, {version: q.version, readiness: {ready: q.ready, blockers: Array(count)}}, false),
      q.stage === 'ready' ? h('div', {class: 'form', style: 'margin-top:12px'}, h('p', {class: 'muted', text: 'Approval and signatures happen in the eQMS. Record its reference here; this version becomes the baseline that later updates redline against.'}),
        h('div', {class: 'fields'}, h('div', {class: 'field'}, h('label', {for: refId, text: 'eQMS reference (required)'}), reference), h('div', {class: 'field wide'}, h('label', {for: noteId, text: 'Comment'}), comment)),
        h('div', {class: 'actions'}, record), status)
        : q.stage === 'approved' ? note('v' + q.version + ' is the approved baseline.', 'ok')
        : h('p', {class: 'muted', style: 'margin-top:8px'}, 'Clear the review blockers first. ', h('a', {href: '#/review/queue', text: 'Open the review queue'})),
      q.approvals.length ? h('div', {style: 'margin-top:12px'}, table(['Version', 'eQMS reference', 'Recorded by', 'Date', 'Comment'], q.approvals.map(a => h('tr', {}, h('td', {class: 'num', text: 'v' + a.version}), h('td', {class: 'id', text: a.reference}), h('td', {text: a.approver}), h('td', {class: 'num', text: when(a.approved_at)}), h('td', {text: a.comment || '—'}))))) : null);
  });
}

/* settings */
async function settingsPage(tab) {
  if (!['azure', 'ai'].includes(tab)) tab = 'azure';
  const data = await api(base() + '/settings');
  const tabs = h('nav', {class: 'tabs', 'aria-label': 'Settings'}, [['azure', 'Azure DevOps'], ['ai', 'AI drafting']].map(([key, label]) => h('a', {href: '#/settings/' + key, text: label, 'aria-current': key === tab ? 'page' : null})));
  if (tab === 'ai') {
    const ai = data.ai, b = ai.budget || {};
    const budget = 'remaining_credits' in b ? b.remaining_credits.toFixed(1) + ' of ' + b.hard_cap_credits + ' credits left' : 'remaining_usd' in b ? '$' + b.remaining_usd.toFixed(2) + ' of $' + b.hard_cap_usd.toFixed(2) + ' left' : '—';
    return [head('Settings', 'AI drafting is configured in the ignored .env file on this computer.'), tabs,
      section('AI drafting', null, h('dl', {class: 'kv'}, h('dt', {text: 'Provider'}), h('dd', {text: ai.provider}), h('dt', {text: 'Model'}), h('dd', {text: ai.model || '—'}),
        ai.copilot_mode ? [h('dt', {text: 'Copilot transport'}), h('dd', {text: ai.copilot_mode})] : null,
        h('dt', {text: 'Company data clearance'}), h('dd', {text: ai.real_data_approval || 'Not recorded'}), h('dt', {text: 'Budget'}), h('dd', {class: 'num', text: budget}))),
      section('Guardrails', null, h('ul', {class: 'rows'},
        h('li', {text: 'Every AI call goes through the cost ledger, the response cache, the claim validator and the data guard.'}),
        h('li', {text: 'Personal OpenAI and Anthropic keys never receive company evidence; only the cleared Copilot Studio flow can.'}),
        h('li', {text: 'The mock provider copies source text to exercise the pipeline, not to write prose.'})))];
  }
  const connection = data.connections.find(c => c.document_type === null);
  const overrides = data.connections.filter(c => c.document_type);
  const shown = flash ? note(flash.text, flash.tone) : null;
  flash = null;
  return [head('Settings', 'The project connection is shared by every document that does not use its own.'), tabs, shown,
    data.encryption_configured ? null : note('Set APP_ENCRYPTION_KEY in .env before saving a PAT. The README shows how to generate one.', 'warn'),
    h('div', {class: 'cols'},
      section('Azure DevOps connection', 'read-only', connectionForm(null, connection, () => render(false))),
      h('div', {},
        section('Document connections', null, overrides.length ? h('ul', {class: 'rows'}, overrides.map(c => h('li', {}, h('a', {href: '#/documents/' + c.document_type, text: SHORT[c.document_type]}), h('span', {class: 'muted', text: c.org_url.replace(/^https:\/\//, '') + ' · ' + c.project_name})))) : h('p', {class: 'muted', text: 'None. A document page can switch to its own connection.'})),
        section('PAT activity', 'never the token itself', data.audit.length ? h('ul', {class: 'rows'}, data.audit.map(e => h('li', {}, h('span', {text: e.action.replaceAll('_', ' ') + ' · ' + e.actor}), h('span', {class: 'num muted', text: when(e.at)})))) : h('p', {class: 'muted', text: 'No activity yet.'})),
        section('Other sources', null, h('p', {class: 'muted', text: 'Requirements, tests and code links come from Azure DevOps and uploaded files. GitHub and SharePoint connections are not available in this version.'}))))];
}

/* start */
function setTheme(theme) {
  document.documentElement.dataset.theme = theme;
  $('theme').textContent = theme === 'dark' ? 'Light appearance' : 'Dark appearance';
  try { localStorage.setItem('dhf-theme', theme); } catch {}
}
async function start() {
  let theme = 'light';
  try { theme = localStorage.getItem('dhf-theme') === 'dark' ? 'dark' : 'light'; } catch {}
  setTheme(theme);
  const grant = new URLSearchParams(location.hash.slice(1)).get('access');
  if (grant) {
    history.replaceState(null, '', location.pathname + '#/overview');
    await api('/api/session', {method: 'POST', headers: {Authorization: 'Bearer ' + grant}});
  }
  ctx.session = await api('/api/session');
  $('who').textContent = ctx.session.actor;
  await loadProjects();
  let saved = null;
  try { saved = localStorage.getItem('dhf-project'); } catch {}
  choose(ctx.projects.some(p => p.id === saved) ? saved : ctx.session.project_id);
  $('project-select').addEventListener('change', event => { choose(event.target.value); if (location.hash === '#/overview') render(); else location.hash = '#/overview'; });
  $('theme').addEventListener('click', () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'));
  $('menu').addEventListener('click', () => { const open = $('rail').classList.toggle('open'); $('menu').setAttribute('aria-expanded', String(open)); });
  document.addEventListener('keydown', event => { if (event.key === 'Escape' && $('rail').classList.contains('open')) { $('rail').classList.remove('open'); $('menu').setAttribute('aria-expanded', 'false'); $('menu').focus(); } });
  // A new access link pasted into an open tab must start a fresh session.
  window.addEventListener('hashchange', () => location.hash.includes('access=') ? location.reload() : render());
  $('startup').hidden = true; $('app').hidden = false;
  if (!location.hash.startsWith('#/')) history.replaceState(null, '', '#/overview');
  render(false);
}
start().catch(error => { $('startup-text').textContent = error.status === 401 ? 'Open the one-time access link that dhf serve printed.' : error.message; });
})();
</script>
