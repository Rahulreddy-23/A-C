# SSTR in the owner's DHF structure (DHF_TEMPLATE_SET=bd).
# Overlay on specs/documents/sstr.yaml: shared sections are referenced by ID and change
# only title, heading level and group heading, so queries, prompts and validators are the
# defaults by construction. Owner-only headings needing records outside the evidence graph
# are human sections. Order follows the owner's document.
id: sstr
extends: sstr
title: Software System Test Report (SSTR)
sections:
- id: purpose_scope
  title: Introduction/Purpose
  heading_level: 2
- id: references
  title: Scope
  heading_level: 3
  group_title: Plan Execution Summary
- id: readiness_reviews
  title: Readiness Reviews
  mode: human
  heading_level: 3
- id: test_environment
  title: Test Environments
  heading_level: 3
- id: test_types
  title: Software System Test Types Used
  mode: human
  heading_level: 3
- id: tools_analysis
  title: Tools Analysis
  mode: human
  heading_level: 3
- id: results_by_requirement
  title: Traceability
  heading_level: 3
  group_title: Deliverables
- id: deliverable_documents
  title: Documents
  mode: human
  heading_level: 3
- id: results_summary
  title: Software System Test Case Results
  heading_level: 3
  group_title: Test Execution Summary
- id: anomaly_assessment
  title: Failed Tests and Anomaly Assessment
  heading_level: 3
- id: retest_results
  title: Multiple Test Executions
  heading_level: 3
- id: summary_by_build
  title: Summary by Build
  mode: human
  heading_level: 3
- id: security_testing
  title: Third Party For Security Testing
  mode: human
  heading_level: 3
- id: non_requirement_testing
  title: Non-Requirement Testing
  mode: human
  heading_level: 3
- id: residual_anomalies
  title: Known Residual Anomalies
  heading_level: 3
- id: verification_gaps
  title: Verification Coverage Gaps
  heading_level: 3
- id: release_conclusion
  title: Conclusion
  heading_level: 2
- id: evidence_index
  title: Evidence Index
  heading_level: 2
- id: version_history
  title: Version History
  mode: human
  heading_level: 2
- id: approvals
  title: Approvals
  heading_level: 2
