# Ingest scope for a real ADO project (copy outside git, e.g. out/real/scope.yaml, and set ADO_SCOPE).
# Without a scope the whole project is read, which real projects refuse above max_items.

# Work items to start from: explicit IDs and/or files of ADO work-item URLs or IDs (one per line,
# paths relative to this file).
seed_ids: []
seed_files: []
#  - ../../dataset/requirement-urls.txt
#  - ../../dataset/specification-urls.txt

# Optional WIQL query whose results are added to the seeds.
# wiql: "SELECT [System.Id] FROM WorkItems WHERE [System.TeamProject] = @project AND [System.AreaPath] UNDER 'Project\\Area'"

# Follow links outward from the seeds (ADO shows each link on both ends).
follow:
  depth: 1
  # relations: leave unset for the default, which follows Parent/Child, Tested By and both
  # ends of every link type the mapping traces (e.g. Dependency between requirements and
  # specifications). List link reference names only to override that; [] reads the seeds alone.

max_items: 2000
# Revision history per item powers change tracking; one extra request per work item.
history: true
# Test runs and results come only from these test plans; results for out-of-scope cases are skipped.
test_plans: []
# Quoted release label for runs of these plans whose names carry no "Release x.y". Every
# such run of the listed plans is attributed to it, so list only plans run for that release.
# release: "1.0"
# Source repository to clone read-only for code evidence; empty skips code evidence.
repository: ""
# Design documents that supply the architecture when no source code is in scope (ADR-044):
# software items, units and their allocations, read locally on every ingest (folder relative
# to this file). ADO stays the source for requirements, specifications and tests.
# documents: ../../dhf-documents
# documents: {folder: ../../dhf-documents, types: [component, software_unit]}
