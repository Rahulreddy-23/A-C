- id: SRS-001
  type: software_req
  title: Flow bounds
  body: Reject flow outside configured bounds. This behavior belongs to COMP-01 and
    prevents silent divergence between operator intent and delivered therapy. Reject
    invalid input explicitly and retain the prior validated state on failure.
  attributes:
    synthetic: true
    acceptance_criteria: Rates 0.01 and 120 mL/h are accepted under a 120 mL/h maximum;
      zero, negative, non-finite and 120.01 mL/h are rejected without configuration
      change.
    component: COMP-01
    risk_control: true
    revision: 1
    changed_at: '2026-09-20T12:00:00Z'
    requirement_history:
    - revision: 1
      changed_at: '2026-09-20T12:00:00Z'
- id: SRS-002
  type: software_req
  title: Volume limit
  body: Stop when delivered volume reaches configured target. This behavior belongs
    to COMP-02 and prevents silent divergence between operator intent and delivered
    therapy. Reject invalid input explicitly and retain the prior validated state
    on failure.
  attributes:
    synthetic: true
    acceptance_criteria: A target of 1 mL stops delivery at exactly 1 mL; a time step
      requesting more than the remaining volume is clamped to that remaining volume.
    component: COMP-02
    risk_control: true
    revision: 1
    changed_at: '2026-09-20T12:00:00Z'
    requirement_history:
    - revision: 1
      changed_at: '2026-09-20T12:00:00Z'
- id: SRS-003
  type: software_req
  title: Start interlock
  body: Reject start when configuration is invalid. This behavior belongs to COMP-03
    and prevents silent divergence between operator intent and delivered therapy.
    Reject invalid input explicitly and retain the prior validated state on failure.
  attributes:
    synthetic: true
    acceptance_criteria: Start with missing configuration or an active sensor fault
      returns inhibited output and records a fault; start with valid settings enters
      RUNNING.
    component: COMP-03
    risk_control: true
    revision: 1
    changed_at: '2026-09-20T12:00:00Z'
    requirement_history:
    - revision: 1
      changed_at: '2026-09-20T12:00:00Z'
- id: SRS-004
  type: software_req
  title: Pause control
  body: Pause motor output on operator request. This behavior belongs to COMP-04 and
    prevents silent divergence between operator intent and delivered therapy. Reject
    invalid input explicitly and retain the prior validated state on failure.
  attributes:
    synthetic: true
    acceptance_criteria: Pausing a running session returns zero commanded output on
      the next tick and preserves accumulated delivered volume.
    component: COMP-04
    risk_control: true
    revision: 1
    changed_at: '2026-09-20T12:00:00Z'
    requirement_history:
    - revision: 1
      changed_at: '2026-09-20T12:00:00Z'
- id: SRS-005
  type: software_req
  title: Stop control
  body: Stop output and preserve delivered volume. This behavior belongs to COMP-05
    and prevents silent divergence between operator intent and delivered therapy.
    Reject invalid input explicitly and retain the prior validated state on failure.
  attributes:
    synthetic: true
    acceptance_criteria: Stopping a session returns zero output on every subsequent
      tick; delivered volume and the stop event remain available.
    component: COMP-05
    risk_control: true
    revision: 1
    changed_at: '2026-09-20T12:00:00Z'
    requirement_history:
    - revision: 1
      changed_at: '2026-09-20T12:00:00Z'
- id: SRS-006
  type: software_req
  title: Rate conversion
  body: Convert flow into motor pulse intervals. This behavior belongs to COMP-06
    and prevents silent divergence between operator intent and delivered therapy.
    Reject invalid input explicitly and retain the prior validated state on failure.
  attributes:
    synthetic: true
    acceptance_criteria: At 60 mL/h and 60 pulses/mL the pulse interval is 1 s; nonpositive
      rate or calibration raises ValueError.
    component: COMP-06
    risk_control: true
    revision: 1
    changed_at: '2026-09-20T12:00:00Z'
    requirement_history:
    - revision: 1
      changed_at: '2026-09-20T12:00:00Z'
- id: SRS-007
  type: software_req
  title: Dose calculation
  body: Calculate dose from concentration and volume. This behavior belongs to COMP-01
    and prevents silent divergence between operator intent and delivered therapy.
    Reject invalid input explicitly and retain the prior validated state on failure.
  attributes:
    synthetic: true
    acceptance_criteria: For a dose of 2 units and concentration of 4 units/mL, the
      calculated volume is 0.5 mL; zero concentration is rejected.
    component: COMP-01
    risk_control: true
    revision: 1
    changed_at: '2026-09-20T12:00:00Z'
    requirement_history:
    - revision: 1
      changed_at: '2026-09-20T12:00:00Z'
- id: SRS-008
  type: software_req
  title: Air detection
  body: Stop infusion when air sensor exceeds the configured limit. This behavior
    belongs to COMP-02 and prevents silent divergence between operator intent and
    delivered therapy. Reject invalid input explicitly and retain the prior validated
    state on failure.
  attributes:
    synthetic: true
    acceptance_criteria: An air reading above the configured limit stops output and
      latches an alarm; a missing or disconnected sample has the same inhibited outcome.
    component: COMP-02
    risk_control: true
    revision: 1
    changed_at: '2026-09-20T12:00:00Z'
    requirement_history:
    - revision: 1
      changed_at: '2026-09-20T12:00:00Z'
- id: SRS-009
  type: software_req
  title: Pressure sampling
  body: Validate pressure readings before use. This behavior belongs to COMP-03 and
    prevents silent divergence between operator intent and delivered therapy. Reject
    invalid input explicitly and retain the prior validated state on failure.
  attributes:
    synthetic: true
    acceptance_criteria: Negative, missing, non-finite and decreasing-timestamp pressure
      samples inhibit output; valid ordered samples preserve their measured value.
    component: COMP-03
    risk_control: true
    revision: 1
    changed_at: '2026-09-20T12:00:00Z'
    requirement_history:
    - revision: 1
      changed_at: '2026-09-20T12:00:00Z'
- id: SRS-010
  type: software_req
  title: Sensor diagnostics
  body: Latch a fault when the sensor disconnects. This behavior belongs to COMP-04
    and prevents silent divergence between operator intent and delivered therapy.
    Reject invalid input explicitly and retain the prior validated state on failure.
  attributes:
    synthetic: true
    acceptance_criteria: Disconnecting a sensor produces a retained fault; reconnecting
      alone cannot clear it without an explicit safe acknowledgement.
    component: COMP-04
    risk_control: true
    revision: 1
    changed_at: '2026-09-20T12:00:00Z'
    requirement_history:
    - revision: 1
      changed_at: '2026-09-20T12:00:00Z'
- id: SRS-011
  type: software_req
  title: Alarm priority
  body: Prioritize critical faults over advisories. This behavior belongs to COMP-05
    and prevents silent divergence between operator intent and delivered therapy.
    Reject invalid input explicitly and retain the prior validated state on failure.
  attributes:
    synthetic: true
    acceptance_criteria: Given advisory, warning and critical events, the selected
      visible event has critical priority; ties use stable code order.
    component: COMP-05
    risk_control: true
    revision: 1
    changed_at: '2026-09-20T12:00:00Z'
    requirement_history:
    - revision: 1
      changed_at: '2026-09-20T12:00:00Z'
- id: SRS-012
  type: software_req
  title: Alarm latch
  body: Keep critical alarms active until acknowledged safely. This behavior belongs
    to COMP-06 and prevents silent divergence between operator intent and delivered
    therapy. Reject invalid input explicitly and retain the prior validated state
    on failure.
  attributes:
    synthetic: true
    acceptance_criteria: A critical alarm remains active after acknowledgement while
      unsafe is true; it clears only after safe state and acknowledgement.
    component: COMP-06
    risk_control: true
    revision: 1
    changed_at: '2026-09-20T12:00:00Z'
    requirement_history:
    - revision: 1
      changed_at: '2026-09-20T12:00:00Z'
- id: SRS-013
  type: software_req
  title: Alarm acknowledgement
  body: Record acknowledgement without clearing an active unsafe condition. This behavior
    belongs to COMP-01 and prevents silent divergence between operator intent and
    delivered therapy. Reject invalid input explicitly and retain the prior validated
    state on failure.
  attributes:
    synthetic: true
    acceptance_criteria: Every acknowledgement appends an event containing the code
      and active state; acknowledging an unknown code raises KeyError.
    component: COMP-01
    risk_control: false
    revision: 1
    changed_at: '2026-09-20T12:00:00Z'
    requirement_history:
    - revision: 1
      changed_at: '2026-09-20T12:00:00Z'
- id: SRS-014
  type: software_req
  title: Audible alarm
  body: Schedule audible alerts while critical alarms remain active. This behavior
    belongs to COMP-02 and prevents silent divergence between operator intent and
    delivered therapy. Reject invalid input explicitly and retain the prior validated
    state on failure.
  attributes:
    synthetic: true
    acceptance_criteria: A critical active latch schedules an audible pulse at the
      configured interval; expired mute requests resume the scheduled pulse.
    component: COMP-02
    risk_control: false
    revision: 1
    changed_at: '2026-09-20T12:00:00Z'
    requirement_history:
    - revision: 1
      changed_at: '2026-09-20T12:00:00Z'
- id: SRS-015
  type: software_req
  title: Display status
  body: Show operating mode and delivered volume. This behavior belongs to COMP-03
    and prevents silent divergence between operator intent and delivered therapy.
    Reject invalid input explicitly and retain the prior validated state on failure.
  attributes:
    synthetic: true
    acceptance_criteria: Status returns the current mode and delivered volume; a negative
      displayed volume is clamped to zero and never changes control state.
    component: COMP-03
    risk_control: false
    revision: 1
    changed_at: '2026-09-20T12:00:00Z'
    requirement_history:
    - revision: 1
      changed_at: '2026-09-20T12:00:00Z'
- id: SRS-016
  type: software_req
  title: Input validation
  body: Reject malformed operator entries. This behavior belongs to COMP-04 and prevents
    silent divergence between operator intent and delivered therapy. Reject invalid
    input explicitly and retain the prior validated state on failure.
  attributes:
    synthetic: true
    acceptance_criteria: Input text for a finite rate inside configured bounds is
      accepted; empty, malformed, negative and out-of-bounds text is rejected.
    component: COMP-04
    risk_control: false
    revision: 1
    changed_at: '2026-09-20T12:00:00Z'
    requirement_history:
    - revision: 1
      changed_at: '2026-09-20T12:00:00Z'
- id: SRS-017
  type: software_req
  title: Configuration confirmation
  body: Require confirmation before applying a new configuration. This behavior belongs
    to COMP-05 and prevents silent divergence between operator intent and delivered
    therapy. Reject invalid input explicitly and retain the prior validated state
    on failure.
  attributes:
    synthetic: true
    acceptance_criteria: Rejecting a configuration confirmation preserves the previous
      settings byte-for-byte; accepting returns a copy of the proposed validated settings.
    component: COMP-05
    risk_control: false
    revision: 1
    changed_at: '2026-09-20T12:00:00Z'
    requirement_history:
    - revision: 1
      changed_at: '2026-09-20T12:00:00Z'
- id: SRS-018
  type: software_req
  title: Drug limit validation
  body: Reject doses outside library limits. This behavior belongs to COMP-06 and
    prevents silent divergence between operator intent and delivered therapy. Reject
    invalid input explicitly and retain the prior validated state on failure.
  attributes:
    synthetic: true
    acceptance_criteria: Doses exactly at configured minimum and maximum are accepted;
      values below minimum or above maximum are rejected before volume calculation.
    component: COMP-06
    risk_control: false
    revision: 1
    changed_at: '2026-09-20T12:00:00Z'
    requirement_history:
    - revision: 1
      changed_at: '2026-09-20T12:00:00Z'
- id: SRS-019
  type: software_req
  title: Drug lookup
  body: Find configured drug records by stable key. This behavior belongs to COMP-01
    and prevents silent divergence between operator intent and delivered therapy.
    Reject invalid input explicitly and retain the prior validated state on failure.
  attributes:
    synthetic: true
    acceptance_criteria: Lookup of a known drug key returns an independent record
      copy; missing keys raise KeyError and never return a default drug.
    component: COMP-01
    risk_control: false
    revision: 1
    changed_at: '2026-09-20T12:00:00Z'
    requirement_history:
    - revision: 1
      changed_at: '2026-09-20T12:00:00Z'
- id: SRS-020
  type: software_req
  title: Library checksum
  body: Reject a library with invalid checksum. This behavior belongs to COMP-02 and
    prevents silent divergence between operator intent and delivered therapy. Reject
    invalid input explicitly and retain the prior validated state on failure.
  attributes:
    synthetic: true
    acceptance_criteria: Modifying any serialized library entry changes the expected
      checksum; a mismatched checksum prevents library activation.
    component: COMP-02
    risk_control: false
    revision: 1
    changed_at: '2026-09-20T12:00:00Z'
    requirement_history:
    - revision: 1
      changed_at: '2026-09-20T12:00:00Z'
- id: SRS-021
  type: software_req
  title: Occlusion threshold
  body: The Sensor Monitoring component shall detect downstream occlusion when pressure
    remains above 80 kPa, stop output and request a latched critical alarm. A bounded
    dwell filters transient spikes without hiding sustained occlusion.
  attributes:
    synthetic: true
    acceptance_criteria: With downstream pressure held above 80 kPa for 3 s, output
      is stopped and a critical alarm is latched at the 3 s boundary. Exactly 80 kPa
      does not trigger; invalid samples inhibit output.
    component: COMP-03
    risk_control: false
    revision: 1
    changed_at: '2026-09-20T12:00:00Z'
    requirement_history:
    - revision: 1
      changed_at: '2026-09-20T12:00:00Z'
- id: SRS-022
  type: software_req
  title: Pressure filtering
  body: Filter pressure samples over the configured window. This behavior belongs
    to COMP-03 and prevents silent divergence between operator intent and delivered
    therapy. Reject invalid input explicitly and retain the prior validated state
    on failure.
  attributes:
    synthetic: true
    acceptance_criteria: A filter window of 3 retains at most 3 valid values; input
      [10, 20, 30] yields 20, and an invalid sample leaves the window unchanged.
    component: COMP-03
    risk_control: false
    revision: 1
    changed_at: '2026-09-20T12:00:00Z'
    requirement_history:
    - revision: 1
      changed_at: '2026-09-20T12:00:00Z'
- id: SRS-023
  type: software_req
  title: Sensor calibration
  body: Apply calibration offset to valid readings. This behavior belongs to COMP-03
    and prevents silent divergence between operator intent and delivered therapy.
    Reject invalid input explicitly and retain the prior validated state on failure.
  attributes:
    synthetic: true
    acceptance_criteria: A reading of 10 with offset 2 yields 12 under unit gain;
      a non-finite calibration or nonpositive gain is rejected before activation.
    component: COMP-03
    risk_control: false
    revision: 1
    changed_at: '2026-09-20T12:00:00Z'
    requirement_history:
    - revision: 1
      changed_at: '2026-09-20T12:00:00Z'
- id: SRS-024
  type: software_req
  title: Event persistence
  body: Append ordered events to the audit log. This behavior belongs to COMP-06 and
    prevents silent divergence between operator intent and delivered therapy. Reject
    invalid input explicitly and retain the prior validated state on failure.
  attributes:
    synthetic: true
    acceptance_criteria: Appending ordered events preserves insertion order and event
      content; a decreasing timestamp is rejected without altering existing records.
    component: COMP-06
    risk_control: false
    revision: 1
    changed_at: '2026-09-20T12:00:00Z'
    requirement_history:
    - revision: 1
      changed_at: '2026-09-20T12:00:00Z'
- id: SRS-025
  type: software_req
  title: Log integrity
  body: Detect modified log records using content digests. This behavior belongs to
    COMP-01 and prevents silent divergence between operator intent and delivered therapy.
    Reject invalid input explicitly and retain the prior validated state on failure.
  attributes:
    synthetic: true
    acceptance_criteria: Changing one byte in a recorded payload changes its SHA256
      digest; verification against the original digest returns false.
    component: COMP-01
    risk_control: false
    revision: 1
    changed_at: '2026-09-20T12:00:00Z'
    requirement_history:
    - revision: 1
      changed_at: '2026-09-20T12:00:00Z'
- id: SRS-026
  type: software_req
  title: Communication framing
  body: Validate incoming message framing. This behavior belongs to COMP-02 and prevents
    silent divergence between operator intent and delivered therapy. Reject invalid
    input explicitly and retain the prior validated state on failure.
  attributes:
    synthetic: true
    acceptance_criteria: 'A frame begins with KIC: and ends with a newline; missing
      header, terminator, oversized or empty payload is rejected.'
    component: COMP-02
    risk_control: false
    revision: 1
    changed_at: '2026-09-20T12:00:00Z'
    requirement_history:
    - revision: 1
      changed_at: '2026-09-20T12:00:00Z'
- id: SRS-027
  type: software_req
  title: Communication timeout
  body: Signal a timeout when a response is overdue. This behavior belongs to COMP-03
    and prevents silent divergence between operator intent and delivered therapy.
    Reject invalid input explicitly and retain the prior validated state on failure.
  attributes:
    synthetic: true
    acceptance_criteria: A response age equal to the configured timeout is not overdue;
      an age greater than the timeout signals a retained communication fault.
    component: COMP-03
    risk_control: false
    revision: 1
    changed_at: '2026-09-20T12:00:00Z'
    requirement_history:
    - revision: 1
      changed_at: '2026-09-20T12:00:00Z'
- id: SRS-028
  type: software_req
  title: Delivery estimation
  body: Integrate commanded flow over elapsed time. This behavior belongs to COMP-04
    and prevents silent divergence between operator intent and delivered therapy.
    Reject invalid input explicitly and retain the prior validated state on failure.
  attributes:
    synthetic: true
    acceptance_criteria: At 60 mL/h over 60 s, commanded delivered volume increases
      by 1 mL while running; paused or inhibited sessions deliver zero.
    component: COMP-04
    risk_control: false
    revision: 1
    changed_at: '2026-09-20T12:00:00Z'
    requirement_history:
    - revision: 1
      changed_at: '2026-09-20T12:00:00Z'
- id: SRS-029
  type: software_req
  title: Watchdog
  body: Stop output when watchdog heartbeat expires. This behavior belongs to COMP-05
    and prevents silent divergence between operator intent and delivered therapy.
    Reject invalid input explicitly and retain the prior validated state on failure.
  attributes:
    synthetic: true
    acceptance_criteria: A heartbeat older than the configured expiry inhibits output;
      backwards or non-finite clock input raises a fault.
    component: COMP-05
    risk_control: false
    revision: 1
    changed_at: '2026-09-20T12:00:00Z'
    requirement_history:
    - revision: 1
      changed_at: '2026-09-20T12:00:00Z'
- id: SRS-030
  type: software_req
  title: Power loss recovery
