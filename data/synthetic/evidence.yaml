- id: COMP-01
  type: component
  title: UI
  body: Accept proposed rate/volume settings through ui_input; ui_confirm retains
    the previous configuration when the operator cancels. ui_status displays mode
    and delivered volume. Collaborates with Infusion Control for configuration acceptance;
    it cannot clear active unsafe alarms.
  attributes:
    synthetic: true
    responsibility: Operator configuration and status
    safety_class: B
    interfaces:
    - operator controls
    - display status
    collaborators:
    - COMP-02
    - COMP-04
- id: COMP-02
  type: component
  title: Infusion Control
  body: Infusion Control validates DeliveryConfiguration atomically before start,
    rejects configuration edits while running, and clamps each delivered increment
    to remaining target volume. Sensor Monitoring supplies safe/fault decisions; Alarm
    Manager supplies active critical latches. Faults inhibit delivery and restart
    requires a valid configuration.
  attributes:
    synthetic: true
    responsibility: Validated delivery state and volume bounds
    safety_class: C
    interfaces:
    - DeliveryConfiguration
    - sensor_safe
    - alarm_active
    - motor command
    collaborators:
    - COMP-03
    - COMP-04
    - COMP-05
- id: COMP-03
  type: component
  title: Sensor Monitoring
  body: Sensor Monitoring validates finite ordered pressure samples, applies the configured
    threshold and dwell interval, and retains an occlusion latch until safe acknowledgement.
    Air monitoring treats invalid or missing samples as faults. Calibration rejects
    invalid gain before activation. Pressure decisions request a critical alarm through
    Alarm Manager.
  attributes:
    synthetic: true
    responsibility: Sample validation and occlusion/air detection
    safety_class: C
    interfaces:
    - PressureSample
    - PressureDecision
    - air sample
    - calibration gain
    collaborators:
    - COMP-02
    - COMP-04
- id: COMP-04
  type: component
  title: Alarm Manager
  body: Alarm Manager records events independently of display refresh, orders visible
    alarms by priority, and keeps an unsafe condition active after acknowledgement.
    Critical active alarms request inhibited delivery; audio and display present that
    latch without owning its recovery state.
  attributes:
    synthetic: true
    responsibility: Persistent critical alarm state
    safety_class: C
    interfaces:
    - AlarmRegistry.update
    - acknowledge
    - stop_required
    - visible
    collaborators:
    - COMP-01
    - COMP-02
    - COMP-03
- id: COMP-05
  type: component
  title: Drug Library
  body: Drug Library resolves stable record keys and validates dose/rate against configured
    bounds before activation. Invalid values and missing records prevent configuration
    acceptance. Its validated limits support Infusion Control and are presented through
    operator configuration.
  attributes:
    synthetic: true
    responsibility: Drug lookup and dose validation
    safety_class: C
    interfaces:
    - drug key
    - dose limits
    - validated limit decision
    collaborators:
    - COMP-01
    - COMP-02
- id: COMP-06
  type: component
  title: Logging & Comms
  body: Comms & Logging retains ordered timestamped events, hashes records for integrity
    checks, validates framed messages and detects communication timeout. Diagnostics
    captures trace summaries. These services report faults; they do not own the delivery
    stop path.
  attributes:
    synthetic: true
    responsibility: Ordered audit records and bounded communication
    safety_class: C
    interfaces:
    - event append
    - digest
    - frame checksum
    - timeout
    collaborators:
    - COMP-01
    - COMP-02
