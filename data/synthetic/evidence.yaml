- id: SYS-001
  type: system_req
  title: 'System obligation: Set and monitor infusion'
  body: The Kestrel controller shall provide set and monitor infusion during simulated
    operation. Allocate this obligation to software while keeping unsafe-condition
    handling independent of UI refresh. Verification uses the bench simulator and
    recorded run metadata.
  attributes:
    synthetic: true
    safety_class: C
