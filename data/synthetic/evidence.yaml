- id: HAZ-01
  type: hazard
  title: Over infusion
  body: 'Hazardous situation: over infusion during commanded delivery. Cause sequence:
    Rate or accumulated-volume limits bypassed. Foreseeable harm: Life-threatening
    fluid overdose. Severity 5 is assigned in the synthetic risk file because the
    consequence is life-threatening fluid overdose. Existing controls require explicit
    trace and verification; no residual-risk acceptance is asserted.'
  attributes:
    synthetic: true
    severity: 5
    safety_class: C
- id: HAZ-02
  type: hazard
  title: Under infusion
  body: 'Hazardous situation: under infusion during commanded delivery. Cause sequence:
    Motor stops without a sustained operator alert. Foreseeable harm: Interrupted
    therapy requiring intervention. Severity 4 is assigned in the synthetic risk file
    because the consequence is interrupted therapy requiring intervention. Existing
    controls require explicit trace and verification; no residual-risk acceptance
    is asserted.'
  attributes:
    synthetic: true
    severity: 4
    safety_class: C
- id: HAZ-03
  type: hazard
  title: Air delivery
  body: 'Hazardous situation: air delivery during commanded delivery. Cause sequence:
    Air sensor fault or threshold not enforced. Foreseeable harm: Air embolism with
    serious injury. Severity 5 is assigned in the synthetic risk file because the
    consequence is air embolism with serious injury. Existing controls require explicit
    trace and verification; no residual-risk acceptance is asserted.'
  attributes:
    synthetic: true
    severity: 5
    safety_class: C
- id: HAZ-04
  type: hazard
  title: Undetected occlusion
  body: 'Hazardous situation: undetected occlusion during commanded delivery. Cause
    sequence: Pressure sampling or alarm latency exceeds control limits. Foreseeable
    harm: Delayed therapy and potential serious deterioration. Severity 4 is assigned
    in the synthetic risk file because the consequence is delayed therapy and potential
    serious deterioration. Existing controls require explicit trace and verification;
    no residual-risk acceptance is asserted.'
  attributes:
    synthetic: true
    severity: 4
    safety_class: C
- id: HAZ-05
  type: hazard
  title: Alarm unavailable
  body: 'Hazardous situation: alarm unavailable during commanded delivery. Cause sequence:
    Alarm output unavailable during a critical fault. Foreseeable harm: Unsafe delivery
    continuing without operator warning. Severity 5 is assigned in the synthetic risk
    file because the consequence is unsafe delivery continuing without operator warning.
    Existing controls require explicit trace and verification; no residual-risk acceptance
    is asserted.'
  attributes:
    synthetic: true
    severity: 5
    safety_class: C
- id: HAZ-06
  type: hazard
  title: Incorrect drug limit
  body: 'Hazardous situation: incorrect drug limit during commanded delivery. Cause
    sequence: Library corruption or invalid dose limits accepted. Foreseeable harm:
    Incorrect medication delivery causing serious injury. Severity 4 is assigned in
    the synthetic risk file because the consequence is incorrect medication delivery
    causing serious injury. Existing controls require explicit trace and verification;
    no residual-risk acceptance is asserted.'
  attributes:
    synthetic: true
    severity: 4
    safety_class: C
- id: HAZ-07
  type: hazard
  title: Lost audit evidence
  body: 'Hazardous situation: lost audit evidence during commanded delivery. Cause
    sequence: Event storage is lost or its ordering is corrupted. Foreseeable harm:
    Unavailable event evidence delays corrective action. Severity 3 is assigned in
    the synthetic risk file because the consequence is unavailable event evidence
    delays corrective action. Existing controls require explicit trace and verification;
    no residual-risk acceptance is asserted.'
  attributes:
    synthetic: true
    severity: 3
    safety_class: C
- id: HAZ-08
  type: hazard
  title: Unintended restart
  body: 'Hazardous situation: unintended restart during commanded delivery. Cause
    sequence: Unvalidated stored configuration is resumed automatically. Foreseeable
    harm: Unexpected delivery after restart causes overdose. Severity 5 is assigned
    in the synthetic risk file because the consequence is unexpected delivery after
    restart causes overdose. Existing controls require explicit trace and verification;
    no residual-risk acceptance is asserted.'
  attributes:
    synthetic: true
    severity: 5
    safety_class: C
- id: RC-01
  type: risk_control
  title: 'Control 1: Flow bounds'
  body: Enforce flow bounds in the control path before delivery state is updated.
    On a validation fault, inhibit output and route a latched event to Alarm Manager.
    Verification must challenge boundary, invalid-input and recovery conditions; the
    trace graph records whether a realizing requirement and test exist.
