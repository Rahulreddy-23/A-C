rules:
- id: G01
  title: SRS has no verifying test
  types:
  - software_req
  op: missing_link
  link: verifies
  direction: in
  peer_types:
  - test_case
  action: Add or link a verifying test for the requirement.
- id: G02
  title: SRS has no implementing change
  types:
  - software_req
  op: missing_link
  link: implements
  direction: in
  peer_types:
  - code_change
  action: Link an implementing change or record a justified implementation gap.
- id: G03
  title: Orphan code or PR
  types:
  - code_change
  - software_unit
  op: missing_link
  link: implements
  direction: out
  peer_types:
  - software_req
  action: Link existing requirements or propose a requirement for human review.
- id: G04
  title: Test case has no requirement
  types:
  - test_case
  op: missing_link
  link: verifies
  direction: out
  peer_types:
  - software_req
  action: Link the test to its verified requirement or justify its standalone scope.
- id: G05
  title: Failed result has no defect
  types:
  - test_result
  attrs:
    outcome: Failed
  op: missing_link
  link: reports_defect
  direction: out
  peer_types:
  - defect
  action: Raise or link a defect for the failed result, or record a justified anomaly
    assessment.
- id: G06
  title: Risk control has no realizing requirement
  types:
  - risk_control
  op: missing_link
  link: implements
  direction: in
  peer_types:
  - software_req
  action: Trace the risk control to its realizing requirement.
- id: G07
  title: Risk-control requirement has no verification
  types:
  - software_req
  attrs:
    risk_control: true
  op: missing_link
  link: verifies
  direction: in
  peer_types:
  - test_case
  action: Add verification evidence for the risk-control requirement.
- id: G08
  title: System requirement has no derived SRS
  types:
  - system_req
  op: missing_link
  link: derives_from
  direction: in
  peer_types:
  - software_req
  action: Derive software requirements or justify non-software realization.
- id: G09
  title: SRS has no parent system requirement
  types:
  - software_req
  op: missing_link
  link: derives_from
  direction: out
  peer_types:
  - system_req
  action: Link the parent system requirement or justify the requirement origin.
- id: G10
  title: Open defect omitted from residual anomalies
  types:
  - defect
  attrs:
    residual_listed: false
  not_attrs:
    state: Closed
  op: match
  action: Include the open defect in residual anomalies with human-reviewed rationale.
- id: G11
  title: Test passed against an older requirement revision
  types:
  - test_case
  op: outdated_verification
  action: Rerun verification against the current requirement revision.
- id: G12
  title: SOUP requirements or known-anomaly evaluation not recorded
  types:
  - soup
  op: soup_requirements
  action: Record SOUP functional/performance requirements and evaluate its known anomaly
    list.
