- id: TC-001
  type: test_case
  title: Verify flow bounds — case 001
  body: 'Preconditions: synthetic bench is reset, validated configuration loaded,
    event recorder enabled. Steps: (1) exercise flow bounds with nominal input; (2)
    challenge its boundary; (3) repeat with invalid input; (4) record controller mode,
    result and alarms. Expected result: Rates 0.01 and 120 mL/h are accepted under
    a 120 mL/h maximum; zero, negative, non-finite and 120.01 mL/h are rejected without
    configuration change.'
  attributes:
    synthetic: true
    level: system
    preconditions: Reset synthetic bench; valid configuration; event recorder enabled
    steps: Nominal, boundary and invalid input for flow bounds
    expected_result: Rates 0.01 and 120 mL/h are accepted under a 120 mL/h maximum;
      zero, negative, non-finite and 120.01 mL/h are rejected without configuration
      change.
- id: TC-002
  type: test_case
  title: Verify volume limit — case 002
  body: 'Preconditions: synthetic bench is reset, validated configuration loaded,
    event recorder enabled. Steps: (1) exercise volume limit with nominal input; (2)
    challenge its boundary; (3) repeat with invalid input; (4) record controller mode,
    result and alarms. Expected result: A target of 1 mL stops delivery at exactly
    1 mL; a time step requesting more than the remaining volume is clamped to that
    remaining volume.'
