- id: ADR-01
  type: adr
  title: Latch critical alarms
  body: 'Context: a transient unsafe condition can disappear while an operator is
    attending to another task. Decision: critical alarms are stateful and remain latched
    until acknowledgement and safe sensor state are both present. Consequences: the
    control path owns the latch, the UI cannot clear an active fault, and tests must
    cover acknowledge-while-unsafe and recovery.'
  attributes:
    synthetic: true
- id: ADR-02
  type: adr
  title: Use explicit validated configuration
  body: 'Context: operator edits and recovered storage may contain partially validated
    settings. Decision: apply an immutable validated configuration only after all
    bounds and checksum checks pass. Consequences: invalid edits preserve the current
    configuration; restart begins inhibited and requires explicit confirmation; configuration
    and validation evidence are logged.'
  attributes:
    synthetic: true
- id: REV-01
  type: review
  title: Previous design review
  body: 'Architecture review of the synthetic Kestrel controller. Scope: allocation
    of unsafe-condition controls, retained configuration and event evidence. Previous
    decisions require explicit trace links and boundary tests; open actions remain
    subject to human review.'
  attributes:
    synthetic: true
    date: '2026-09-25'
    participants:
    - Synthetic Reviewer A
    - Synthetic Reviewer B
    baseline: SAD v1.0
    review_type: architecture
