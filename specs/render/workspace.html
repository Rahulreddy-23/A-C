<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DHF Automation</title>
<style>
:root{color-scheme:light;
--bg:#f5f6f8;--surface:#fff;--subtle:#f9fafb;--text:#1b1f27;--muted:#5b6472;--border:#e1e4ea;--strong:#c5cad3;
--brand:#0f6cbd;--brand-hover:#115ea3;--brand-wash:#ebf3fc;--on-brand:#fff;
--ok:#0e700e;--ok-wash:#e9f6e9;--warn:#8a4f00;--warn-wash:#fff5d6;--bad:#b10e1c;--bad-wash:#fde7e9;
--stale:#5c2e91;--stale-wash:#f3ecfa;--fill-warn:#b87400;--side:#fbfbfc;--focus:#0f6cbd;--shadow:0 1px 2px rgba(15,23,42,.06),0 1px 3px rgba(15,23,42,.08)}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;
--bg:#14161a;--surface:#1d2026;--subtle:#22262d;--text:#e8eaee;--muted:#a5adba;--border:#2f343d;--strong:#454c57;
--brand:#4f9eea;--brand-hover:#6aaeee;--brand-wash:#18324c;--on-brand:#0b1420;
--ok:#6ccb6c;--ok-wash:#163222;--warn:#e9b44c;--warn-wash:#3a2d12;--bad:#f08a93;--bad-wash:#3c1b1f;
--stale:#c4a1ef;--stale-wash:#2e2140;--fill-warn:#e9b44c;--side:#181b20;--focus:#6aaeee;--shadow:none}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/20px "Segoe UI",system-ui,-apple-system,BlinkMacSystemFont,sans-serif}
a{color:var(--brand)}a:hover{color:var(--brand-hover)}
h1,h2,h3,h4,p{margin:0}
h1{font-size:24px;line-height:32px;font-weight:600}
h2{font-size:16px;line-height:22px;font-weight:600}
h3{font-size:14px;font-weight:600}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.app{display:grid;grid-template-columns:248px minmax(0,1fr);grid-template-rows:48px minmax(0,1fr);height:100%}
.topbar{grid-column:1/-1;display:flex;align-items:center;gap:16px;padding:0 16px;background:var(--surface);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;color:var(--text);text-decoration:none;white-space:nowrap}
.brand svg{color:var(--brand)}
.switch{display:flex;align-items:center;gap:8px;min-width:0;margin-left:8px}
.switch label{color:var(--muted);font-size:12px}
.switch select{max-width:260px;min-height:32px}
.who{margin-left:auto;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .menu{display:none}
.sidebar{background:var(--side);border-right:1px solid var(--border);overflow:auto;padding:12px 8px 24px}
.sidebar a{display:flex;align-items:center;gap:10px;padding:7px 12px;border-radius:6px;color:var(--text);text-decoration:none}
.sidebar a:hover{background:var(--brand-wash)}
.sidebar a[aria-current=page]{background:var(--brand-wash);color:var(--brand);font-weight:600;box-shadow:inset 3px 0 0 var(--brand)}
.sidebar svg{flex:none;color:var(--muted)}
.sidebar a[aria-current=page] svg{color:var(--brand)}
.group{margin-top:14px}
.group>span{display:block;padding:4px 12px;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.group a{padding-left:38px}
main{overflow:auto;padding:24px 32px 64px}
main:focus,main:focus-visible{outline:none}
.page{max-width:1280px;margin:0 auto}
.page-head{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:20px}
.page-head p{color:var(--muted);margin-top:4px;max-width:80ch}
.crumbs{font-size:12px;color:var(--muted);margin-bottom:4px}
.grid{display:grid;gap:16px}
.cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.cols-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:var(--surface);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow);padding:16px 20px;min-width:0}
.card>h2{margin-bottom:4px}
.card>.hint{color:var(--muted);margin-bottom:12px}
.card+.card{margin-top:16px}
.grid>.card+.card{margin-top:0}
.kpi{display:flex;flex-direction:column;gap:4px}
.kpi .label{color:var(--muted);font-size:13px}
.kpi .value{font-size:28px;line-height:36px;font-weight:600;font-variant-numeric:tabular-nums}
.kpi .sub{color:var(--muted);font-size:12px}
.bar-row{display:grid;grid-template-columns:minmax(120px,200px) minmax(0,1fr) auto;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--border)}
.bar-row:first-of-type{border-top:0}
.bar{height:8px;border-radius:4px;background:var(--subtle);border:1px solid var(--border);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--fill-warn)}
.bar>i.full{background:var(--ok)}
.bar-row .num{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.badge{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:10px;font-size:12px;font-weight:600;line-height:18px;white-space:nowrap;background:var(--subtle);color:var(--muted);border:1px solid var(--border)}
.badge.info{background:var(--brand-wash);color:var(--brand);border-color:transparent}
.badge.success{background:var(--ok-wash);color:var(--ok);border-color:transparent}
.badge.warning{background:var(--warn-wash);color:var(--warn);border-color:transparent}
.badge.danger{background:var(--bad-wash);color:var(--bad);border-color:transparent}
.badge.stale{background:var(--stale-wash);color:var(--stale);border-color:transparent}
.tabs{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--border);margin-bottom:16px}
.tabs a{padding:8px 12px;color:var(--muted);text-decoration:none;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs a:hover{color:var(--text)}
.tabs a[aria-current=page]{color:var(--text);font-weight:600;border-color:var(--brand)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:32px;padding:5px 12px;border-radius:4px;border:1px solid var(--strong);background:var(--surface);color:var(--text);font:inherit;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--subtle);color:var(--text)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.primary:hover{background:var(--brand-hover);color:var(--on-brand)}
.btn.danger{color:var(--bad)}
.btn.subtle{border-color:transparent;background:transparent;color:var(--brand)}
.btn.subtle:hover{background:var(--brand-wash)}
.btn:disabled{opacity:.5;cursor:default}
.actions{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span,.field>label{font-weight:600}
.field small,.help{color:var(--muted);font-size:12px}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}
.fields .wide{grid-column:1/-1}
input:not([type=file]):not([type=checkbox]),select,textarea{width:100%;min-height:32px;padding:5px 8px;border:1px solid var(--strong);border-bottom-color:var(--muted);border-radius:4px;background:var(--surface);color:var(--text);font:inherit}
textarea{min-height:80px;resize:vertical}
input:disabled{opacity:.6}
.password{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.stack>*+*{margin-top:12px}
.notice{padding:10px 12px;border-radius:6px;background:var(--brand-wash);color:var(--text);border-left:3px solid var(--brand);overflow-wrap:anywhere}
.notice.success{background:var(--ok-wash);border-color:var(--ok)}
.notice.warning{background:var(--warn-wash);border-color:var(--warn)}
.notice.error{background:var(--bad-wash);border-color:var(--bad)}
.notice:empty{display:none}
.muted{color:var(--muted)}
.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px}
.table-wrap{overflow:auto;max-width:100%;border:1px solid var(--border);border-radius:6px}
table{width:100%;border-collapse:collapse;text-align:left}
th,td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:top;overflow-wrap:anywhere}
th{position:sticky;top:0;background:var(--subtle);font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap;z-index:1}
tbody tr:last-child td{border-bottom:0}
td.missing{color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{display:inline-block;padding:0 6px;border-radius:4px;background:var(--subtle);border:1px solid var(--border);font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px;line-height:18px;color:var(--text);text-decoration:none}
a.chip:hover{border-color:var(--brand)}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:12px}
.toolbar input[type=search]{max-width:320px}
.toolbar select{width:auto;min-width:160px}
.check{display:inline-flex;align-items:center;gap:6px}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.empty h2{color:var(--text);margin-bottom:6px}
.empty .actions{justify-content:center;margin-top:16px}
.list>*+*{border-top:1px solid var(--border)}
.item{padding:14px 0}
.item:first-child{padding-top:4px}
.item-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:6px}
.item p{max-width:100ch}
.meta{display:flex;flex-wrap:wrap;gap:4px 16px;color:var(--muted);font-size:12px;margin-top:6px}
.stepper{display:flex;flex-wrap:wrap;gap:0;margin:4px 0 0;padding:0;list-style:none}
.stepper li{display:flex;align-items:center;gap:8px;padding:6px 16px 6px 0;color:var(--muted);font-size:13px}
.stepper li+li::before{content:"";width:24px;height:1px;background:var(--strong);margin-right:8px}
.stepper .dot{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;border:1px solid var(--strong);font-size:12px;font-weight:600;background:var(--surface)}
.stepper .done .dot{background:var(--ok);border-color:var(--ok);color:var(--on-brand)}
.stepper .now{color:var(--text);font-weight:600}
.stepper .now .dot{border-color:var(--brand);color:var(--brand);box-shadow:0 0 0 3px var(--brand-wash)}
.upload{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-top:1px solid var(--border)}
.upload:first-child{border-top:0;padding-top:0}
.upload-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
.file-pick{position:relative;overflow:hidden}
.file-pick input{position:absolute;inset:0;opacity:0;cursor:pointer}
.file-pick:focus-within{outline:2px solid var(--focus);outline-offset:2px}
.file-row{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;padding:2px 0;overflow-wrap:anywhere}
.project-card{display:flex;flex-direction:column;gap:8px}
.project-card dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 12px;margin:0;font-size:13px}
.project-card dt{color:var(--muted)}.project-card dd{margin:0;overflow-wrap:anywhere}
.project-card .actions{margin-top:auto;padding-top:8px}
.kv{display:grid;grid-template-columns:minmax(140px,max-content) minmax(0,1fr);gap:6px 16px;margin:0}
.kv dt{color:var(--muted)}.kv dd{margin:0;overflow-wrap:anywhere}
details>summary{cursor:pointer;color:var(--brand);font-weight:600}
details[open]>summary{margin-bottom:8px}
.startup{display:grid;place-items:center;min-height:100%;padding:24px;text-align:center}
.spinner{width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite;display:inline-block;vertical-align:middle}
@keyframes spin{to{transform:rotate(1turn)}}
@media (prefers-reduced-motion:reduce){.spinner{animation:none}}
@media (max-width:1100px){.cols-4{grid-template-columns:repeat(2,minmax(0,1fr))}.cols-3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){
.app{grid-template-columns:minmax(0,1fr)}
.topbar .menu{display:inline-flex}
.sidebar{position:fixed;top:48px;bottom:0;left:0;width:260px;z-index:10;box-shadow:0 8px 24px rgba(0,0,0,.2);transform:translateX(-105%);transition:transform .15s ease}
.sidebar.open{transform:none}
main{padding:16px}
.cols-2,.cols-3,.cols-4{grid-template-columns:minmax(0,1fr)}
.switch label{display:none}
}
@media (max-width:560px){.fields{grid-template-columns:minmax(0,1fr)}.who{display:none}.bar-row{grid-template-columns:minmax(0,1fr) auto}.bar-row .bar{grid-column:1/-1;grid-row:2}}
@media (prefers-reduced-motion:reduce){.sidebar{transition:none}}
</style>
</head>
<body>
<div class="startup" id="startup"><p id="startup-text" role="status"><span class="spinner" aria-hidden="true"></span> Opening workspace…</p></div>
<div class="app" id="app" hidden>
<header class="topbar">
<button class="btn subtle menu" id="menu" type="button" aria-controls="sidebar" aria-expanded="false" aria-label="Open navigation">
<svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg></button>
<a class="brand" href="#/dashboard"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 2.5h8.5L19 7v14.5H6z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M14.5 2.5V7H19M9 12h7M9 15.5h7M9 19h4" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>DHF Automation</a>
<div class="switch"><label for="project-select">Project</label><select id="project-select" aria-label="Current project"></select></div>
<span class="who" id="who"></span>
</header>
<nav class="sidebar" id="sidebar" aria-label="Main">
<a href="#/dashboard" data-route="dashboard"><svg width="16" height="16" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 3h6v8H3zM11 3h6v5h-6zM11 10h6v7h-6zM3 13h6v4H3z" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>Dashboard</a>
<a href="#/projects" data-route="projects"><svg width="16" height="16" viewBox="0 0 20 20" aria-hidden="true"><path d="M2.5 5.5h5l1.5 2h8.5v9h-15z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>Projects</a>
<div class="group"><span id="nav-documents">Documents</span><div role="group" aria-labelledby="nav-documents" id="nav-docs"></div></div>
<div class="group"><span id="nav-trace">Traceability</span><div role="group" aria-labelledby="nav-trace">
<a href="#/traceability/requirements" data-route="traceability/requirements">Requirements coverage</a>
<a href="#/traceability/design" data-route="traceability/design">Design coverage</a>
<a href="#/traceability/code" data-route="traceability/code">Code coverage</a>
<a href="#/traceability/verification" data-route="traceability/verification">Verification coverage</a>
<a href="#/traceability/risk" data-route="traceability/risk">Risk coverage</a>
<a href="#/traceability/gaps" data-route="traceability/gaps">Gap analysis</a>
</div></div>
<div class="group"><span id="nav-review">Review Center</span><div role="group" aria-labelledby="nav-review">
<a href="#/review/suggestions" data-route="review/suggestions">AI suggestions</a>
<a href="#/review/changes" data-route="review/changes">Tracked changes</a>
<a href="#/review/queue" data-route="review/queue">Review queue</a>
<a href="#/review/approval" data-route="review/approval">Approval workflow</a>
</div></div>
<div class="group"><span id="nav-settings">Settings</span><div role="group" aria-labelledby="nav-settings">
<a href="#/settings/azure" data-route="settings/azure">Azure DevOps</a>
<a href="#/settings/ai" data-route="settings/ai">AI configuration</a>
</div></div>
</nav>
<main id="main" tabindex="-1" aria-live="polite"></main>
</div>
<script>
'use strict';
(() => {
const $ = id => document.getElementById(id);
const ctx = {session: null, projects: [], pid: null, project: null};
const DOCS = ['sad', 'sdd', 'sstr', 'drr', 'sfmea'];
const SHORT = {sad: 'SAD', sdd: 'SDD', sstr: 'SSTR', drr: 'DRR', sfmea: 'sFMEA'};
const NAV = {sad: 'Architecture', sdd: 'Detailed design', sstr: 'System test report', drr: 'Design review', sfmea: 'Software FMEA'};
const STAGES = {
  no_inputs: ['No inputs yet', ''], inputs_ready: ['Inputs ready', 'info'], draft: ['Draft ready', 'info'],
  in_review: ['In review', 'warning'], ready: ['Ready for approval', 'success'], approved: ['Approved', 'success']
};
const REASONS = {
  section_integrity: 'Section boundaries were edited', ai_unavailable: 'Section AI could not draft',
  stale: 'Section is stale against the evidence', human_input_required: 'Section needs human input',
  unresolved_suggestion: 'AI suggestion awaiting a decision', rejected_text_present: 'Rejected text still present',
  suggestion_label_present: 'Suggestion label still present', unreviewed_validator_rejection: 'Validator rejection not reviewed'
};
const SELECTORS = {
  saved_query: ['Saved Query ID', 'GUID of a saved query'], wiql: ['WIQL', 'SELECT [System.Id] FROM WorkItems WHERE …'],
  area_path: ['Area Path', 'Project\\Area'], work_item_ids: ['Work Item IDs', '1201, 1202, 1215']
};
const TYPE_NAMES = {
  user_need: 'User need', system_req: 'System requirement', software_req: 'Software requirement',
  component: 'Software item', software_unit: 'Software unit', code_change: 'Code change', test_case: 'Test case',
  test_result: 'Test result', test_run: 'Test run', risk_control: 'Risk control', hazard: 'Hazard', defect: 'Defect',
  review: 'Review', action_item: 'Action item', adr: 'Architecture decision', soup: 'SOUP', document_section: 'Document section'
};
let view = 0, busy = false;

function h(tag, props, ...children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(props || {})) {
    if (value === undefined || value === null || value === false) continue;
    if (key === 'class') node.className = value;
    else if (key === 'text') node.textContent = value;
    else if (key.startsWith('on')) node.addEventListener(key.slice(2), value);
    else if (key in node && typeof value !== 'string') node[key] = value;
    else node.setAttribute(key, value === true ? '' : value);
  }
  for (const child of children.flat(Infinity)) {
    if (child === undefined || child === null || child === false) continue;
    node.append(child instanceof Node ? child : document.createTextNode(String(child)));
  }
  return node;
}
const svg = path => {
  const ns = 'http://www.w3.org/2000/svg', icon = document.createElementNS(ns, 'svg');
  icon.setAttribute('width', '16'); icon.setAttribute('height', '16'); icon.setAttribute('viewBox', '0 0 20 20');
  icon.setAttribute('aria-hidden', 'true');
  const line = document.createElementNS(ns, 'path');
  line.setAttribute('d', path); line.setAttribute('fill', 'none'); line.setAttribute('stroke', 'currentColor');
  line.setAttribute('stroke-width', '1.5'); line.setAttribute('stroke-linejoin', 'round');
  icon.append(line);
  return icon;
};
// Evidence URLs become links only when they are web addresses.
const web = url => /^https?:\/\//i.test(url || '') ? url : null;
const when = value => value ? new Date(value).toLocaleString() : '—';
const pct = value => (Math.round(value * 10) / 10).toLocaleString() + '%';
const plural = (n, one, many = one + 's') => n.toLocaleString() + ' ' + (n === 1 ? one : many);
const badge = (text, tone = '') => h('span', {class: 'badge ' + tone, text});
const stageBadge = stage => badge(...(STAGES[stage] || [stage, '']));
const notice = (text, tone = '', role = 'status') => h('p', {class: 'notice ' + tone, role: tone === 'error' ? 'alert' : role, text});
function setNotice(node, text, tone = '') {
  node.textContent = text; node.className = 'notice ' + tone;
  node.setAttribute('role', tone === 'error' ? 'alert' : 'status');
}
const card = (title, hint, ...body) => h('section', {class: 'card'}, title && h('h2', {text: title}), hint && h('p', {class: 'hint', text: hint}), ...body);
const pageHead = (title, text, ...actions) => h('div', {class: 'page-head'},
  h('div', {}, h('p', {class: 'crumbs', text: ctx.project?.details.name || ctx.pid || ''}), h('h1', {text: title}), text && h('p', {text})),
  actions.some(Boolean) ? h('div', {class: 'actions'}, actions) : null);
const link = (href, text, cls = 'btn') => h('a', {class: cls, href, text});
const external = (href, text, cls = 'btn') => h('a', {class: cls, href, text, target: '_blank', rel: 'noopener'});
function empty(title, text, ...actions) {
  return h('div', {class: 'card empty'}, h('h2', {text: title}), h('p', {text}), actions.length ? h('div', {class: 'actions'}, actions) : null);
}

async function api(path, options = {}) {
  const response = await fetch(path, {credentials: 'same-origin', ...options});
  const type = response.headers.get('Content-Type') || '';
  const result = type.includes('json') ? await response.json() : {};
  if (!response.ok) throw Object.assign(new Error(result.error || 'Request failed.'), {action: result.action, status: response.status});
  return result;
}
const send = (method, value) => ({method, headers: {'Content-Type': 'application/json'}, body: JSON.stringify(value ?? {})});
const base = () => '/api/projects/' + encodeURIComponent(ctx.pid);
const docRoute = doc => base() + '/documents/' + doc;

async function act(button, fn, onError) {
  if (busy) return;
  busy = true;
  if (button) { button.disabled = true; button.setAttribute('aria-busy', 'true'); }
  try { await fn(); }
  catch (error) { onError ? onError(error) : alert(error.message); }
  finally {
    busy = false;
    if (button?.isConnected) { button.disabled = false; button.removeAttribute('aria-busy'); }
  }
}

function bars(rows) {
  return h('div', {}, rows.map(row => {
    const full = row.total && row.covered === row.total;
    const value = row.assessable === false ? null : row.percent;
    return h('div', {class: 'bar-row'},
      h('span', {}, row.href ? h('a', {href: row.href, text: row.label}) : row.label),

          overrides.length ? h('ul', {style: 'margin:0;padding-left:20px'}, overrides.map(c => h('li', {}, h('a', {href: '#/documents/' + c.document_type, text: SHORT[c.document_type]}), ' · ' + c.org_url + ' / ' + c.project_name))) : h('p', {class: 'muted', text: 'None.'})),
        card('PAT activity', 'Saving, replacing and removing tokens is recorded without the token.',
          data.audit.length ? h('ul', {style: 'margin:0;padding-left:20px'}, data.audit.map(e => h('li', {text: e.action.replaceAll('_', ' ') + ' · ' + e.actor + ' · ' + when(e.at)}))) : h('p', {class: 'muted', text: 'No activity yet.'})),
        card('Other sources', null, h('p', {class: 'muted', text: 'Code, tests and requirements come from Azure DevOps and uploaded files. GitHub and SharePoint connections are not available in this version.'}))))];
}

/* ---------- start ---------- */
async function start() {
  const grant = new URLSearchParams(location.hash.slice(1)).get('access');
  if (grant) {
    history.replaceState(null, '', location.pathname + '#/dashboard');
    await api('/api/session', {method: 'POST', headers: {Authorization: 'Bearer ' + grant}});
  }
  ctx.session = await api('/api/session');
  $('who').textContent = 'Signed in as ' + ctx.session.actor;
  $('nav-docs').replaceChildren(...DOCS.filter(d => ctx.session.profile.documents[d]).map(d =>
    h('a', {href: '#/documents/' + d, 'data-route': 'documents/' + d, title: ctx.session.profile.documents[d].title}, SHORT[d] + ' · ' + NAV[d])));
  await loadProjects();
  let saved = null;
  try { saved = localStorage.getItem('dhf-project'); } catch {}
  const known = id => ctx.projects.some(p => p.id === id);
  await choose(known(saved) ? saved : ctx.session.project_id);
  $('project-select').addEventListener('change', event => act(null, async () => {
    await choose(event.target.value);
    location.hash = '#/dashboard';
    render();
  }));
  $('menu').addEventListener('click', () => {
    const open = $('sidebar').classList.toggle('open');
    $('menu').setAttribute('aria-expanded', String(open));
  });
  window.addEventListener('hashchange', () => render());
  $('startup').hidden = true;
  $('app').hidden = false;
  if (!location.hash.startsWith('#/')) history.replaceState(null, '', '#/dashboard');
  render(false);
}
start().catch(error => {
  $('startup-text').textContent = error.status === 401 ? 'Open the one-time access link printed by dhf serve.' : error.message;
});
})();
</script>
