- id: BUG-01
  type: defect
  title: Air sensor transient not latched
  body: 'A transient high air reading is detected but the critical alarm clears without
    acknowledgement. Unsafe-condition indication can disappear before review. Impact
    assessment: Operator may miss an air condition; keep synthetic bench delivery
    inhibited until latch verification passes. Status rationale: Follow-up review
    required.'
