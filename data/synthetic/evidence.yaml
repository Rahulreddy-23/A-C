- id: UNIT-ui_status
  type: software_unit
  title: ui_status
  body: "def status(mode: str, volume: float) -> dict:\n    return {\"mode\": mode,\
    \ \"delivered_ml\": max(0.0, volume)}"
  attributes:
    synthetic: true
    component: COMP-01
    path: kestrel/ui_status.py
- id: UNIT-ui_input
  type: software_unit
  title: ui_input
  body: "def parse_rate(value: str, maximum: float) -> float:\n    rate = float(value)\n\
    \    if not 0 < rate <= maximum:\n        raise ValueError(\"Invalid rate\")\n\
    \    return rate"
  attributes:
    synthetic: true
    component: COMP-01
    path: kestrel/ui_input.py
- id: UNIT-ui_confirm
  type: software_unit
  title: ui_confirm
  body: "def confirm(current: dict, proposed: dict, accepted: bool) -> dict:\n   \
    \ return dict(proposed if accepted else current)"
  attributes:
    synthetic: true
    component: COMP-01
    path: kestrel/ui_confirm.py
- id: UNIT-infusion_bounds
  type: software_unit
  title: infusion_bounds
  body: "def within_bounds(rate: float, minimum: float, maximum: float) -> bool:\n\
    \    return minimum <= rate <= maximum"
  attributes:
    synthetic: true
    component: COMP-02
    path: kestrel/infusion_bounds.py
- id: UNIT-infusion_volume
  type: software_unit
  title: infusion_volume
  body: "def target_reached(delivered: float, target: float) -> bool:\n    return\
    \ delivered >= target"
  attributes:
    synthetic: true
    component: COMP-02
    path: kestrel/infusion_volume.py
- id: UNIT-infusion_motor
  type: software_unit
  title: infusion_motor
  body: "def pulse_interval(rate: float, pulses_per_ml: int) -> float:\n    if rate\
    \ <= 0 or pulses_per_ml <= 0:\n        raise ValueError(\"Positive rate and calibration\
    \ required\")\n    return 3600.0 / (rate * pulses_per_ml)"
  attributes:
    synthetic: true
    component: COMP-02
    path: kestrel/infusion_motor.py
- id: UNIT-sensor_pressure
  type: software_unit
  title: sensor_pressure
  body: "def occluded(pressure: float, threshold: float = 80.0) -> bool:\n    if pressure\
    \ < 0:\n        raise ValueError(\"Invalid pressure\")\n    return pressure >\
    \ threshold"
  attributes:
    synthetic: true
    component: COMP-03
    path: kestrel/sensor_pressure.py
- id: UNIT-sensor_air
  type: software_unit
  title: sensor_air
  body: "def air_detected(reading: float, limit: float) -> bool:\n    return reading\
    \ > limit"
  attributes:
    synthetic: true
    component: COMP-03
    path: kestrel/sensor_air.py
- id: UNIT-sensor_filter
  type: software_unit
  title: sensor_filter
  body: "def average(samples: list[float]) -> float:\n    if not samples:\n      \
    \  raise ValueError(\"No samples\")\n    return sum(samples) / len(samples)"
  attributes:
    synthetic: true
    component: COMP-03
    path: kestrel/sensor_filter.py
- id: UNIT-sensor_calibration
  type: software_unit
  title: sensor_calibration
  body: "def calibrated(reading: float, offset: float) -> float:\n    return reading\
    \ + offset"
  attributes:
    synthetic: true
    component: COMP-03
    path: kestrel/sensor_calibration.py
- id: UNIT-alarm_priority
  type: software_unit
  title: alarm_priority
  body: "def highest(alarms: list[dict]) -> dict | None:\n    return max(alarms, key=lambda\
    \ a: a[\"priority\"], default=None)"
  attributes:
    synthetic: true
    component: COMP-04
    path: kestrel/alarm_priority.py
- id: UNIT-alarm_latch
  type: software_unit
  title: alarm_latch
  body: "def latched(active: bool, acknowledged: bool, unsafe: bool) -> bool:\n  \
    \  return unsafe or (active and not acknowledged)"
  attributes:
    synthetic: true
    component: COMP-04
    path: kestrel/alarm_latch.py
- id: UNIT-alarm_audio
  type: software_unit
  title: alarm_audio
  body: "def audible(critical: bool, muted: bool) -> bool:\n    return critical and\
    \ not muted"
  attributes:
    synthetic: true
