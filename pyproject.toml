[project]
name = "dhf-automation"
version = "0.1.0"
description = "Synthetic DHF evidence and review automation"
requires-python = ">=3.12,<3.13"
dependencies = ["typer>=0.12", "pydantic>=2", "httpx>=0.27", "jinja2>=3", "pyyaml>=6", "python-docx>=1.2", "anthropic>=1.0", "openai>=1.50"]

[dependency-groups]
dev = ["pytest>=8", "respx>=0.22", "ruff>=0.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dhf", "tools/mock_ado"]

[project.scripts]
dhf = "dhf.cli:app"
mock-ado = "mock_ado.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live_ado: explicit opt-in contract checks against a real org"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
